services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - databaseurl=mysql+pymysql://myuser:mypassword@mysql:3306/mydatabase # This is a placeholder connection string. In production, use environment variables or secrets management to handle sensitive information.
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password # This is a placeholder. In production, use a secure password and consider using environment variables or secrets management.
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
