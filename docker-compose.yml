services:
  app:
    build: . # <-- tells Compose to build an image using the Dockerfile in the current directory
    ports:
      - "8000:8000"
    environment:
      - databaseurl=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DB}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # Create these variables in Jenkins credentials and reference them here for better security.
      MYSQL_DATABASE: ${MYSQL_DB} # Create this variable in Jenkins credentials and reference it here for better security.
      MYSQL_USER: ${MYSQL_USER} # Create this variable in Jenkins credentials and reference it here for better security.
      MYSQL_PASSWORD: ${MYSQL_PASSWORD} # Create this variable in Jenkins credentials and reference it here for better security.
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
